name: Build and Push Jigasi to GHCR

# Replaces ecr-deploy.yml, which cannot work any more: it pushes to ECR repo
# `aiqlick-jigasi` (DELETED — describe-repositories returns
# RepositoryNotFoundException) and then SSMs into EC2 i-0620d2e23695f5bfc to run
# `docker compose pull`, on a host that has been retired. Its last green run was
# 2026-05-30 and the artifact it produced no longer exists anywhere.
#
# The registry for this platform is ghcr.io/aiqlickproject/*, never ECR.
#
# Runs on a GITHUB-HOSTED runner, not the self-hosted ones on qpserver.
#
# The self-hosted runners were the first choice — the Maven cache stays warm on
# the node that consumes the image, and that box has 200G+ free with PVCs on a
# separate volume so a heavy Java build cannot evict production support. They
# cannot be used here: the org runner group is `allows_public_repositories: false`
# and this repo is PUBLIC, so a job targeting them sits queued until GitHub
# cancels it after 24h. Nothing in the run's own logs says why.
#
# The obvious workaround does not exist either: GitHub refuses to make a public
# FORK private ("Public forks can't be made private"), and this is a fork of
# jitsi/jigasi. Detaching from the fork network is a UI-only action.
#
# So: ubuntu-latest, which builds public repos for free and pushes to GHCR just
# the same. The cost is a cold Maven cache each run — the GHA cache below is what
# takes the sting out of that.

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'doc/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/aiqlickproject/jigasi

# A build here is long (Maven resolves the whole Jitsi dependency tree) and two
# concurrent runs would fight over the shared buildx cache. cancel-in-progress is
# false: a superseded build is cheap to let finish, and cancelling mid-export can
# leave the cache in a state the next run has to rebuild from scratch.
concurrency:
  group: jigasi-ghcr
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A hosted runner is a fresh VM every time, so there is no shared builder to
      # reuse and none of the inspect-or-create dance the self-hosted workflows
      # need. Let the action create one per run.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # mode=max, not min: min exports only the final stage and discards the
      # Maven stage, which is the expensive one — the whole point of caching here.
      #
      # Tagged with the FULL sha so the deployed commit is readable straight off
      # the image, the way the rest of this cluster works:
      #   kubectl -n meeting get deploy jitsi-jigasi -o jsonpath='...image'
      # `latest` moves and must never be what a manifest pins.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          # `latest` only from master: a branch dispatched for testing must not move it.
          tags: |
            ${{ env.IMAGE }}:dev-${{ steps.meta.outputs.sha }}
            ${{ github.ref_name == 'master' && format('{0}:latest', env.IMAGE) || '' }}
          # GHA cache, not local: the VM is discarded after each run, so a local
          # cache dir would be empty every time and the Maven stage — the whole
          # reason for caching — would rebuild from scratch on every push.
          cache-from: type=gha,scope=jigasi
          cache-to: type=gha,scope=jigasi,mode=max

      # The Dockerfile itself fails the build if the jar is not the fork (TranscribeService, ColibriWebSocketClient),
      # if the native libraries are for another OS, or if the config it renders differs from upstream's. What is
      # left to prove here is what only the finished image can show: it does not run as root (Kubernetes
      # runAsNonRoot needs a numeric user), its run script is the fork's, it ships the patched Jetty from the
      # pom, and the tools the k8s probes use exist. The probes grep /proc/net/tcp for an ESTABLISHED XMPP
      # connection and are fail-safe, so if grep or procfs were missing they would pass silently and stop
      # protecting anything.
      - name: Verify the image is the fork, unprivileged, and probe-compatible
        run: |
          IMG="${{ env.IMAGE }}:dev-${{ steps.meta.outputs.sha }}"
          docker pull "$IMG"
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            [ "$(id -u)" != "0" ] || { echo "FAIL: image runs as root"; exit 1; }
            case "$(id -u)" in ""|*[!0-9]*) echo "FAIL: non-numeric user"; exit 1;; esac
            grep -q "transcribe.websocket_url" /usr/local/bin/jigasi-run \
              || { echo "FAIL: run script is not the fork custom-run.sh"; exit 1; }
            ls /usr/share/jigasi/lib | grep -Eq "^jetty-security-12\.0\.(3[6-9]|[4-9][0-9])\.jar$" \
              || { echo "FAIL: patched Jetty (>= 12.0.36) is not in lib/"; ls /usr/share/jigasi/lib | grep jetty-security; exit 1; }
            command -v tpl >/dev/null || { echo "FAIL: no tpl"; exit 1; }
            command -v grep >/dev/null || { echo "FAIL: no grep — liveness probe would silently pass"; exit 1; }
            test -r /proc/net/tcp || { echo "FAIL: no procfs — liveness probe would silently pass"; exit 1; }
            echo "OK: unprivileged (uid $(id -u)), fork run script, patched Jetty, probe dependencies present"
          '

      - name: Summary
        run: |
          {
            echo "### Jigasi image pushed"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}:dev-${{ steps.meta.outputs.sha }}"
            echo '```'
            echo ""
            echo "Pin that tag in \`k8s/jitsi/90-jigasi.yaml\`. Do not pin \`latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
